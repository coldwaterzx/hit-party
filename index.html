<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>打擊操作基底</title>
<style>
  :root {
    --bg: #140d0a;
    --panel: rgba(22, 15, 11, 0.9);
    --panel-soft: rgba(22, 15, 11, 0.72);
    --card: rgba(255, 255, 255, 0.045);
    --card-hover: rgba(255, 255, 255, 0.09);
    --line: rgba(255, 255, 255, 0.1);
    --text: #f4ede4;
    --muted: #b3a594;
    --accent: #ffd23f;
    --accent-ink: #1a0d08;
    --danger: #ff6b5a;
    --radius: 14px;
    --font: "Microsoft JhengHei", "Noto Sans TC", "PingFang TC", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
  }
  button { font-family: inherit; color: inherit; }
  kbd {
    display: inline-block;
    min-width: 22px;
    margin: 0 2px;
    padding: 1px 6px;
    border: 1px solid #ffffff3a;
    border-bottom-width: 2px;
    border-radius: 5px;
    background: #ffffff10;
    font-family: inherit;
    font-size: 12px;
    text-align: center;
    color: var(--text);
    white-space: nowrap;
  }
  .muted { color: var(--muted); }
  canvas#c { display: block; width: 100vw; height: 100vh; }
  /* 遊戲畫面（3D＋跳字＋名牌）。主選單、測試場時縮小放到面板之間（ui.js 依視窗大小算 --st-x、--st-s），
     才不會被兩邊的面板擋住 */
  #stage { position: fixed; inset: 0; overflow: hidden; transition: transform 0.35s ease, border-radius 0.35s; }
  body.in-menu #stage, body.lab-mode:not(.lab-hidden) #stage {
    transform: translateX(var(--st-x, 0px)) scale(var(--st-s, 1));
    border-radius: 22px;
    box-shadow: 0 20px 60px #000a, 0 0 0 1px #ffffff14;
  }
  body.in-menu, body.lab-mode { background: radial-gradient(ellipse at 60% 50%, #2a1d16 0%, var(--bg) 70%); }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #ffffff22; border-radius: 8px; }
  ::-webkit-scrollbar-thumb:hover { background: #ffffff3a; }
  canvas#c.ko { filter: grayscale(1) contrast(1.6) brightness(1.08); }

  /* ── 遊戲中的畫面特效 ── */
  #fx-layer { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
  .dmg {
    position: absolute;
    left: 0;
    top: 0;
    font-weight: 900;
    white-space: nowrap;
    -webkit-text-stroke: 3px #1a0d08;
    paint-order: stroke fill;
    text-shadow: 0 3px 0 rgba(0, 0, 0, 0.45);
    will-change: transform, opacity;
  }
  .dmg.big { -webkit-text-stroke: 5px #1a0d08; }
  .dmg.label { font-style: italic; letter-spacing: 1px; }
  #ko-overlay {
    position: absolute;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    pointer-events: none;
    background: repeating-conic-gradient(from 0deg at 50% 50%, rgba(255, 255, 255, 0) 0deg 5deg, rgba(255, 255, 255, 0.16) 5deg 6deg);
  }
  #ko-overlay.on { display: flex; }
  #ko-text {
    font-size: min(15vw, 170px);
    font-weight: 900;
    color: var(--accent);
    -webkit-text-stroke: 7px #111;
    paint-order: stroke fill;
    transform: rotate(-8deg);
    animation: koPop 0.22s cubic-bezier(0.2, 1.7, 0.4, 1);
  }
  @keyframes koPop {
    from { transform: rotate(-8deg) scale(2.4); opacity: 0; }
    to { transform: rotate(-8deg) scale(1); opacity: 1; }
  }
  #hurt-vignette { position: absolute; inset: 0; pointer-events: none; box-shadow: inset 0 0 140px 50px rgba(255, 30, 20, 0.6); opacity: 0; }
  #tags { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
  .tag {
    position: absolute;
    left: 0;
    top: 0;
    font-size: 13px;
    font-weight: 900;
    white-space: nowrap;
    -webkit-text-stroke: 3px #1a0d08;
    paint-order: stroke fill;
  }

  /* ── 遊戲中的 HUD ── */
  .hud { transition: opacity 0.2s; }
  body.in-menu .hud, body.hud-hidden .hud { opacity: 0; pointer-events: none; }
  #match-hud {
    position: fixed;
    top: 12px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 6px;
  }
  #match-hud .cell {
    min-width: 72px;
    padding: 5px 12px 6px;
    background: var(--panel);
    border: 2px solid transparent;
    border-radius: 12px;
    text-align: center;
    backdrop-filter: blur(4px);
  }
  #match-hud .cell.me { box-shadow: 0 0 0 2px #fff5 inset; }
  #match-hud .cell.out { opacity: 0.45; }
  #match-hud .k { font-size: 12px; color: var(--muted); font-weight: 700; }
  #match-hud .v { font-size: 24px; font-weight: 900; line-height: 1.2; -webkit-text-stroke: 2px #1a0d08; paint-order: stroke fill; }
  #match-hud .cell:empty, #match-time-box[style*="none"] { display: none; }
  #scoreboard { display: flex; gap: 6px; }
  #match-time { color: var(--accent); }
  #match-time.hurry { color: var(--danger); }

  #charge-wrap { position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%); width: min(380px, 56vw); }
  #charge { position: relative; height: 12px; background: rgba(0, 0, 0, 0.5); border: 2px solid #ffffff30; border-radius: 10px; overflow: hidden; }
  #charge-fill { height: 100%; width: 0; background: #fff; }
  .mark { position: absolute; top: 0; bottom: 0; width: 2px; background: #000000aa; }
  #charge-label { position: absolute; left: 50%; bottom: 18px; transform: translateX(-50%); font-size: 22px; font-weight: 900; -webkit-text-stroke: 3px #1a0d08; paint-order: stroke fill; }

  #hint {
    position: fixed;
    left: 14px;
    bottom: 14px;
    max-width: calc(50vw - 220px);
    padding: 8px 12px;
    background: var(--panel-soft);
    border-radius: 12px;
    font-size: 13px;
    line-height: 1.9;
    color: var(--muted);
    opacity: 0;
    transition: opacity 0.6s;
    pointer-events: none;
  }
  #hint.on { opacity: 1; }
  #hint b { color: var(--text); }

  #pause-btn {
    position: fixed;
    right: 14px;
    bottom: 14px;
    z-index: 900;
    width: 44px;
    height: 44px;
    border: 2px solid #ffffff28;
    border-radius: 50%;
    background: var(--panel-soft);
    font-size: 16px;
    font-weight: 900;
    cursor: pointer;
  }
  #pause-btn:hover { border-color: var(--accent); }

  #toast {
    position: fixed;
    top: 84px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 1100;
    padding: 8px 16px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 999px;
    font-size: 15px;
    opacity: 0;
    transition: opacity 0.2s;
    pointer-events: none;
  }
  #toast.on { opacity: 1; }

  /* ── 共用：按鈕 ── */
  .big-btn {
    padding: 11px 26px;
    border: none;
    border-radius: 999px;
    background: var(--accent);
    color: var(--accent-ink);
    font-size: 17px;
    font-weight: 900;
    cursor: pointer;
  }
  .big-btn.sub { background: #3a2c24; color: var(--text); }
  .small-btn {
    padding: 6px 10px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--card);
    font-size: 13px;
    cursor: pointer;
  }
  .small-btn:hover { background: var(--card-hover); }
  .small-btn.danger { color: var(--danger); }
  .link-btn { border: none; background: none; color: var(--accent); font-size: 14px; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    padding: 5px 13px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: var(--card);
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
  }
  .chip:hover { background: var(--card-hover); }
  .chip.sel { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .opt-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .opt-label { min-width: 64px; font-size: 13px; color: var(--muted); }

  /* ── 主選單 ── */
  #menu { position: fixed; inset: 0; z-index: 1000; display: none; }
  body.in-menu #menu { display: flex; }
  .menu-panel {
    width: min(560px, 100vw);
    height: 100%;
    display: flex;
    flex-direction: column;
    background: linear-gradient(90deg, rgba(20, 13, 10, 0.97) 0%, rgba(20, 13, 10, 0.93) 85%, rgba(20, 13, 10, 0.7) 100%);
    border-right: 1px solid var(--line);
  }
  .menu-head { padding: 26px 28px 12px; }
  .logo { font-size: 34px; font-weight: 900; color: var(--accent); letter-spacing: 2px; -webkit-text-stroke: 1px #00000055; }
  .ver { margin-top: 2px; font-size: 13px; color: var(--muted); }
  .tagline { margin: 6px 0 0; font-size: 14px; color: var(--muted); }
  .menu-tabs { display: flex; gap: 4px; padding: 6px 24px 0; border-bottom: 1px solid var(--line); overflow-x: auto; }
  .tab {
    padding: 10px 14px;
    border: none;
    border-bottom: 3px solid transparent;
    background: none;
    font-size: 16px;
    font-weight: 700;
    color: var(--muted);
    cursor: pointer;
    white-space: nowrap;
  }
  .tab:hover { color: var(--text); }
  .tab.sel { color: var(--accent); border-bottom-color: var(--accent); }
  .menu-body { flex: 1; overflow-y: auto; padding: 16px 24px; display: flex; flex-direction: column; gap: 14px; }
  .opt-box { display: flex; flex-direction: column; gap: 10px; padding: 12px 14px; background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); }
  .mode-grid { display: flex; flex-direction: column; gap: 10px; }
  .mode-card {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 16px;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: var(--card);
    text-align: left;
    cursor: pointer;
    transition: background 0.12s, border-color 0.12s, transform 0.12s;
  }
  .mode-card:hover { background: var(--card-hover); border-color: var(--accent); transform: translateX(3px); }
  .mode-card .badge {
    flex: none;
    width: 46px;
    height: 46px;
    display: grid;
    place-items: center;
    border-radius: 12px;
    background: var(--accent);
    color: var(--accent-ink);
    font-size: 22px;
    font-weight: 900;
  }
  .mode-text { flex: 1; display: flex; flex-direction: column; gap: 3px; }
  .mode-text b { font-size: 18px; }
  .mode-text .desc { font-size: 13px; line-height: 1.5; color: var(--muted); }
  .mode-text .meta { display: flex; gap: 6px; margin-top: 2px; }
  .mode-text .meta i { font-style: normal; font-size: 12px; padding: 1px 8px; border-radius: 999px; background: #ffffff12; color: var(--muted); }
  .mode-card .go { flex: none; font-size: 14px; font-weight: 900; color: var(--accent); opacity: 0; transition: opacity 0.12s; }
  .mode-card:hover .go { opacity: 1; }
  .menu-foot { padding: 12px 24px 16px; border-top: 1px solid var(--line); display: grid; grid-template-columns: auto 1fr; gap: 8px 14px; align-items: center; }
  .menu-foot .opt-row { display: contents; }
  .menu-foot .opt-label { min-width: 0; }
  .menu-foot .chip { padding: 3px 11px; font-size: 13px; }
  .menu-foot .vol { display: flex; align-items: center; gap: 12px; }
  .menu-foot input[type=range] { width: 140px; accent-color: var(--accent); }
  .menu-preview { flex: 1; position: relative; pointer-events: none; }
  .preview-label {
    position: absolute;
    right: 24px;
    bottom: 40px;
    padding: 6px 14px;
    background: var(--panel-soft);
    border-radius: 999px;
    font-size: 15px;
    font-weight: 700;
  }
  .preview-hint { position: absolute; right: 22px; bottom: 18px; font-size: 12px; color: var(--muted); text-shadow: 0 1px 2px #000; }

  /* ── 對話框（暫停、結算、強化、操作說明） ── */
  .overlay {
    position: fixed;
    inset: 0;
    z-index: 1004;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    padding: 16px;
    background: rgba(12, 7, 5, 0.78);
    text-align: center;
    backdrop-filter: blur(3px);
  }
  .overlay.on { display: flex; }
  .overlay h2 { margin: 0; font-size: 38px; color: var(--accent); }
  .overlay p { color: var(--muted); margin: 0; }
  .overlay .row { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
  #over-board { min-width: min(420px, 90vw); text-align: left; font-size: 14px; }
  #over-board:empty { display: none; }
  #over-board b { color: var(--accent); }
  #over-board ol { margin: 6px 0 0; padding-left: 26px; color: var(--muted); line-height: 1.7; }
  #over-board li.me { color: var(--accent); font-weight: 900; }
  #upgrade-items { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
  .upgrade-card {
    width: 200px;
    padding: 18px 16px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    background: var(--panel);
    border: 2px solid var(--line);
    border-radius: var(--radius);
    cursor: pointer;
    transition: border-color 0.12s, transform 0.12s;
  }
  .upgrade-card:hover { border-color: var(--accent); transform: translateY(-3px); }
  .upgrade-card b { font-size: 20px; color: var(--accent); }
  .upgrade-card span { font-size: 14px; color: var(--muted); }

  .pause-card, .dialog {
    width: min(760px, 94vw);
    max-height: 86vh;
    display: flex;
    text-align: left;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 18px;
    overflow: hidden;
  }
  .pause-nav { width: 200px; flex: none; display: flex; flex-direction: column; gap: 6px; padding: 20px 14px; background: #ffffff06; border-right: 1px solid var(--line); }
  .pause-nav h2 { margin: 0 6px 10px; font-size: 26px; }
  .pause-btn { padding: 10px 14px; border: 1px solid transparent; border-radius: 10px; background: none; font-size: 16px; font-weight: 700; text-align: left; cursor: pointer; }
  .pause-btn:hover, .pause-btn.sel { background: var(--card-hover); }
  .pause-btn.primary { background: var(--accent); color: var(--accent-ink); }
  .pause-btn.danger { margin-top: auto; color: var(--danger); }
  .pause-body, .dialog-body { flex: 1; overflow-y: auto; padding: 20px 24px; }
  .pause-body h3, .dialog-body h3 { margin: 0 0 12px; font-size: 20px; }
  .dialog { flex-direction: column; }
  .dialog-head { display: flex; justify-content: space-between; align-items: center; padding: 16px 22px 0; }
  .dialog-head h3 { margin: 0; font-size: 22px; color: var(--accent); }
  table.keys { width: 100%; border-collapse: collapse; font-size: 14px; }
  table.keys th { font-size: 12px; color: var(--muted); font-weight: 700; text-align: left; padding: 4px 6px; }
  table.keys td { padding: 7px 6px; border-top: 1px solid var(--line); }
  table.keys td:first-child { color: var(--muted); }
  ul.tips { margin: 14px 0 0; padding-left: 20px; color: var(--muted); font-size: 13px; line-height: 1.8; }

  /* ── 調整面板（測試場、暫停的設定） ── */
  .tuner-rows { display: flex; flex-direction: column; gap: 2px; }
  .trow { display: grid; grid-template-columns: 1fr 120px 58px 34px 24px; align-items: center; gap: 6px; padding: 3px 6px; border-radius: 8px; }
  .trow:hover { background: #ffffff08; }
  .trow:has(.switch) { grid-template-columns: 1fr 44px 24px; }
  .tname { font-size: 13px; }
  .tname kbd { margin-left: 6px; font-size: 11px; }
  .trow input[type=range] { width: 100%; accent-color: var(--accent); }
  .tnum { width: 58px; padding: 3px 4px; border: 1px solid var(--line); border-radius: 6px; background: #00000040; color: var(--text); font-family: inherit; font-size: 12px; }
  .tunit { font-size: 11px; color: var(--muted); }
  .treset { width: 24px; height: 24px; border: none; border-radius: 6px; background: none; color: var(--muted); cursor: pointer; visibility: hidden; }
  .trow.changed .treset { visibility: visible; color: var(--accent); }
  .trow.changed .tname { color: var(--accent); }
  .switch { position: relative; width: 40px; height: 22px; border: none; border-radius: 999px; background: #ffffff22; cursor: pointer; }
  .switch::after { content: ''; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: left 0.15s; }
  .switch.on { background: var(--accent); }
  .switch.on::after { left: 21px; }

  /* ── 測試場 ── */
  .lab-ui { display: none; }
  body.lab-mode .lab-ui { display: flex; }
  body.lab-mode.lab-hidden .lab-ui { display: none; }
  #lab-tools {
    position: fixed;
    left: 12px;
    top: 12px;
    bottom: 12px;
    width: 236px;
    flex-direction: column;
    gap: 10px;
    padding: 12px;
    overflow-y: auto;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    z-index: 800;
  }
  .lab-title { display: flex; flex-direction: column; gap: 2px; }
  .lab-title b { font-size: 18px; color: var(--accent); }
  .lab-title span { font-size: 11px; color: var(--muted); line-height: 1.5; }
  .lab-sec-title { font-size: 12px; font-weight: 700; color: var(--muted); margin-bottom: 5px; }
  .lab-btns { display: flex; flex-wrap: wrap; gap: 4px; }
  .lab-btn { padding: 4px 9px; border: 1px solid var(--line); border-radius: 7px; background: var(--card); font-size: 12px; cursor: pointer; }
  .lab-btn:hover { background: var(--card-hover); }
  .lab-btn.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .lab-btn.item { border-left: 3px solid var(--c); }
  #lab-tuner {
    position: fixed;
    right: 12px;
    top: 12px;
    bottom: 70px;
    width: 370px;
    flex-direction: column;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    overflow: hidden;
    z-index: 800;
  }
  .tuner-head { display: flex; align-items: center; gap: 10px; padding: 12px 14px 8px; }
  .tuner-head b { font-size: 17px; color: var(--accent); white-space: nowrap; }
  .tcollapse { border: 1px solid var(--line); border-radius: 8px; background: var(--card); padding: 5px 9px; cursor: pointer; font-size: 13px; }
  body.tuner-collapsed #lab-tuner { width: 44px; bottom: auto; }
  body.tuner-collapsed #lab-tuner > :not(.tuner-head), body.tuner-collapsed .tuner-head > :not(.tcollapse) { display: none; }
  body.tuner-collapsed .tuner-head { padding: 6px; }
  .tsearch { flex: 1; padding: 6px 10px; border: 1px solid var(--line); border-radius: 8px; background: #00000040; color: var(--text); font-family: inherit; font-size: 13px; }
  .tuner-tabs { display: flex; flex-wrap: wrap; gap: 4px; padding: 0 12px 10px; border-bottom: 1px solid var(--line); }
  .ttab { padding: 4px 10px; border: 1px solid var(--line); border-radius: 999px; background: none; font-size: 12px; cursor: pointer; }
  .ttab.sel { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 700; }
  .tuner-body { flex: 1; overflow-y: auto; padding: 6px 8px 10px; }
  .tdesc { margin: 6px 6px 4px; font-size: 12px; color: var(--muted); }
  .tgroup { margin: 12px 6px 4px; font-size: 12px; font-weight: 700; color: var(--accent); letter-spacing: 1px; }
  .tuner-foot { display: flex; flex-wrap: wrap; gap: 6px; padding: 10px 12px; border-top: 1px solid var(--line); }
  #lab-readout {
    position: fixed;
    left: 260px;
    bottom: 12px;
    width: min(460px, calc(100vw - 680px));
    flex-direction: column;
    gap: 4px;
    padding: 10px 12px;
    background: var(--panel-soft);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    font-size: 12px;
    z-index: 800;
  }
  .ro-head { display: flex; justify-content: space-between; color: var(--muted); }
  .ro-head b { color: var(--accent); font-size: 13px; }
  .rec { display: flex; flex-wrap: wrap; gap: 2px 10px; padding: 4px 6px; border-radius: 8px; color: var(--muted); }
  .rec.last { background: #ffffff0c; color: var(--text); }
  .rec b { color: var(--accent); }
  body.lab-mode #charge-wrap { bottom: 150px; }
  body.lab-mode #hint { display: none; }

  #stats { display: none; }

  /* ── 高爾夫：排行榜、小地圖 ── */
  .golf-ui { position: fixed; right: 12px; top: 12px; display: flex; flex-direction: column; align-items: flex-end; gap: 8px; pointer-events: none; }
  .golf-board { min-width: 210px; padding: 8px 10px; background: var(--panel-soft); border: 1px solid var(--line); border-radius: 12px; font-size: 13px; }
  .gb-head { font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  .gb-row { display: grid; grid-template-columns: 12px 1fr auto auto; gap: 8px; align-items: center; padding: 2px 0; }
